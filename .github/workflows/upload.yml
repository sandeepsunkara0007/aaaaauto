name: Auto Upload Resume

on:
  schedule:
    - cron: '0 6 * * *'   # Runs daily at 6:00 AM UTC
  workflow_dispatch:       # Allows manual trigger from GitHub UI

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run resume upload
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: python main.py --headless

      - name: Upload screenshot
        if: always()  # Upload even if the script fails (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: naukri-result
          path: naukri_result.png
