image: python:3.12

stages:
  - upload

daily-resume-upload:
  stage: upload
  only:
    - master
    - schedules
  script:
    # Install system dependencies for Playwright
    - apt-get update -qq
    - apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0
      libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1
      libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0
      xvfb
    # Install Python packages
    - pip install -r requirements.txt
    # Install Playwright Chromium
    - python -m playwright install chromium
    # Run the script with virtual display
    - xvfb-run -a python main.py --headless
  artifacts:
    when: always
    paths:
      - naukri_result.png
    expire_in: 7 days
  variables:
    NAUKRI_EMAIL: $NAUKRI_EMAIL
    NAUKRI_PASSWORD: $NAUKRI_PASSWORD
